<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/fav/favicon.svg" />
    <title>WolfDrive</title>
    <!-- Critical Anti-Flash Script (Must be at top of <head>) -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('wolfdrive-theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (saved === 'system' && prefersDark) || (!saved && prefersDark)) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.backgroundColor = '#131314';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.style.backgroundColor = '#ffffff';
                }
            } catch (e) { }
        })();
    </script>
</head>

<body class="bg-[#FFFFFF] text-[#1F1F1F] antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
